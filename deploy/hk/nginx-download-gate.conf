# Insert into the prima.oxygenai.top server block.
location ^~ /download/api/ {
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    add_header Cache-Control "private, no-store" always;
}

# Insert into the lab.oxygenai.top server block. This is defense in depth:
# the public page links to the gate, while direct release URLs also require it.
location ^~ /releases/ {
    auth_request /_prima_download_auth;
    add_header Cache-Control "private, no-store" always;
    try_files $uri =404;
}
location = /_prima_download_auth {
    internal;
    proxy_pass http://127.0.0.1:8091/download/api/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}
