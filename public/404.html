<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>页面不存在 · Prima</title>
    <meta name="robots" content="noindex" />
    <style>
      :root { --bg:#f7f7f5; --ink:#16181d; --ink-2:rgba(22,24,29,.64); --brand:#0a6b60; }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100svh; display:flex; align-items:center; justify-content:center;
        background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Source Han Sans CN","Segoe UI","Microsoft YaHei",sans-serif; text-align:center; padding:24px; }
      .code { font-size:64px; font-weight:700; letter-spacing:-.02em; margin:0 0 8px; }
      h1 { font-size:22px; margin:0 0 12px; }
      p { color:var(--ink-2); font-size:15px; line-height:1.7; margin:0 0 32px; }
      a.btn { display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:10px 24px;
        border-radius:8px; background:var(--ink); color:#fff; text-decoration:none; font-weight:500; }
      a.btn.ghost { background:transparent; color:var(--ink); border:1px solid rgba(22,24,29,.18); margin-left:12px; }
      a.link { display:block; margin-top:24px; color:var(--brand); font-size:14px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>页面不存在或已被移动</h1>
      <p>地址可能拼写有误。你可以回到首页重新出发，或直接参与产品调研。</p>
      <a class="btn" href="/">回到首页</a>
      <a class="btn ghost" href="/beta/">参与调研</a>
      <a class="link" href="https://oxygenai.top/">了解 Oxygen AI →</a>
    </main>
  </body>
</html>
